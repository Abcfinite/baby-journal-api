service: sports-domain-events-service

frameworkVersion: '3'

plugins:
  - serverless-webpack
  - serverless-offline
  - serverless-offline-scheduler


constructs:
  myqueue:
    type: queue
    worker:
      handler: src/messageConsumer.handler

provider:
  name: aws
  runtime: nodejs16.x
  region: ap-southeast-2
  lambdaHashingVersion: '20201221'
  iamRoleStatements:
    - Effect: Allow
      Action:
        - dynamodb:Query
        - dynamodb:Scan
        - dynamodb:GetItem
        - dynamodb:PutItem
        - dynamodb:UpdateItem
        - dynamodb:DeleteItem
        - s3:ListBucket
        - s3:DeleteObject
        - s3:PutObject
        - s3:GetObject
        - sqs:GetQueueAttributes
        - sqs:SendMessage
        - sqs:PurgeQueue
        - sqs:ReceiveMessage
        - sqs:DeleteMessage
        - ses:SendEmail
      Resource:
        - "arn:aws:dynamodb:ap-southeast-2:*:table/Bets"
        - "arn:aws:dynamodb:ap-southeast-2:*:table/weight"
        - "arn:aws:s3:::betapi-cache" # Resource for s3:ListBucket
        - "arn:aws:s3:::betapi-cache/*"
        - "arn:aws:s3:::tennis-match-schedule" # Resource for s3:ListBucket
        - "arn:aws:s3:::tennis-match-schedule/*"
        - "arn:aws:s3:::table-tennis-match-schedule" # Resource for s3:ListBucket
        - "arn:aws:s3:::table-tennis-match-schedule/*"
        - "arn:aws:s3:::esports-match-schedule" # Resource for s3:ListBucket
        - "arn:aws:s3:::esports-match-schedule/*"
        - "arn:aws:s3:::bet365-table-tennis" # Resource for s3:ListBucket
        - "arn:aws:s3:::bet365-table-tennis/*"
        - "arn:aws:s3:::safe-matches" # Resource for s3:ListBucket
        - "arn:aws:s3:::safe-matches/*"
        - "arn:aws:sqs:ap-southeast-2:146261234111:table-tennis-match-schedule-queue"
        - "arn:aws:ses:ap-southeast-2:146261234111:identity/michaelclairine@gmail.com"
        - "arn:aws:ses:ap-southeast-2:146261234111:identity/togetherwin.com.au"
 # SQS Queue ARN


  environment:
    TENNISLIVE_HOST: ${env:TENNISLIVE_HOST}

custom:
  webpack:
    webpackConfig: './webpack.config.js'
    packager: yarn
  serverless-offline:
    httpPort: 4000

functions:
  removeAllCache:
    handler: index.removeAllCache
    timeout: 900
    events:
      - http:
          path: /removeAllCache
          method: delete
  cacheBetAPI:
    handler: index.cacheBetAPI
    timeout: 900
    events:
      - http:
          path: /cacheBetApi
          method: get
  playersName:
    handler: index.getPlayersName
    timeout: 900
    events:
      - http:
          path: /playersName
          method: get
  playersUrl:
    handler: index.getPlayersUrl
    timeout: 900
    events:
      - http:
          path: /playersUrl
          method: get
  checkPlayer:
    handler: index.checkPlayer
    timeout: 900
    events:
      - http:
          path: /checkPlayer
          method: get
  schedule:
    handler: index.getSchedule
    timeout: 900
    events:
      - http:
          path: /schedule
          method: get
  scheduleTennis:
    handler: index.getScheduleTennis
    timeout: 900
    events:
      - http:
          path: /scheduleTennis
          method: get
  scheduleTT:
    handler: index.getScheduleTT
    timeout: 900
    events:
      - http:
          path: /scheduleTT
          method: get
  scheduleEsports:
    handler: index.getScheduleEsports
    timeout: 900
    events:
      - http:
          path: /scheduleEsports
          method: get
  getPredictions:
    handler: index.getPredictions
    timeout: 900
    events:
      - http:
          path: /predictions
          method: get
  getMatchesPredictions:
    handler: index.getMatchesPredictions
    timeout: 900
    events:
      - http:
          path: /matchesPredictions
          method: get
  result:
    handler: index.getResults
    timeout: 900
    events:
      - http:
          path: /results
          method: get
  # table tennis functions
  tableTennisCheck:
    handler: index.getTableTennisCheck
    timeout: 900
    events:
      - http:
          path: /tableTennisCheck
          method: get
  tableTennisNext:
    handler: index.getTableTennisNext
    timeout: 900
    events:
      - http:
          path: /tableTennisNext
          method: get
  tableTennisResults:
    handler: index.getTableTennisResults
    timeout: 900
    events:
      - http:
          path: /tableTennisResults
          method: get
  getPredictionsTT:
    handler: index.getPredictionsTT
    timeout: 900
    events:
      - http:
          path: /predictionsTT
          method: get
  getMorePrediction:
    handler: index.getMorePrediction
    timeout: 900
    events:
      - http:
          path: /morePrediction
          method: get
  getPendingResults:
    handler: index.getPendingResults
    timeout: 900
    events:
      - http:
          path: /pendingResults
          method: get
  getSafeMatches:
    handler: index.getSafeMatches
    timeout: 900
    events:
      - http:
          path: /safeMatches
          method: get

  getBet365TableTennisList:
    handler: index.getBet365TableTennisList
    timeout: 900
    events:
      - http:
          path: /bet365TableTennisList
          method: get

  getTableTennisEventPattern:
    handler: index.getTableTennisEventPattern
    timeout: 900
    events:
      - http:
          path: /tableTennisEventPattern
          method: get
